<!DOCTYPE html>
<html lang="en">
<head>
<meta charSet="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Gala Retreat — a luxurious farmhouse and grand convention centre for celebrations, gatherings, and weekend getaways."/>
<title>Gala Retreat – Where Moments Find a Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<style>
:root{
  --ivory:#f7f3ed;--cream:#f7f3ed;--gold:#c99538;--gold-bright:#e0b45d;
  --charcoal:#121715;--forest:#03291d;--forest-light:#061c16;
  --stone:#5a5a52;--stone-light:#8a8a80;--warm-brown:#3d3225;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--ivory);color:var(--charcoal);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}

/* ── KEYFRAMES ──────────────────────────────────────────── */
@keyframes kbz{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lineGrow{from{width:0}to{width:100%}}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 2px rgba(212,190,130,0.9)) drop-shadow(0 0 4px rgba(196,176,138,0.5)) brightness(1.1)}
  50%{filter:drop-shadow(0 0 3px rgba(230,210,140,1)) drop-shadow(0 0 7px rgba(212,190,130,0.7)) drop-shadow(0 0 12px rgba(196,176,138,0.35)) brightness(1.2)}
}
@keyframes scrollBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

/* ── ACCESSIBILITY ──────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:0.01ms!important;
  }
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;border-radius:4px}

/* ── GRAIN TEXTURE ──────────────────────────────────────── */
.grain::after{
  content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback,memo}=React;

/* ═══════════════════════════════════════════════════════════
   SVG ICONS — memoized for performance
   ═══════════════════════════════════════════════════════════ */

const ArrowIcon=memo(({size=14,color='#121715'})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <path d="M5 12h14M13 5l7 7-7 7"/>
  </svg>
));

const MenuIcon=memo(({size=22,color='#f7f3ed'})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" aria-hidden="true">
    <path d="M3 7h18M3 12h18M3 17h18"/>
  </svg>
));

const CloseIcon=memo(({size=24,color='#121715'})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" aria-hidden="true">
    <path d="M18 6L6 18M6 6l12 12"/>
  </svg>
));

const ScrollIcon=memo(({size=20,color='#f7f3ed'})=>(
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" aria-hidden="true">
    <path d="M12 5v14M19 12l-7 7-7-7"/>
  </svg>
));

const BrandEmblem=memo(({size=36,color='#c99538'})=>(
  <svg width={size} height={size} viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="24" cy="24" r="18" fill="none" stroke={color} strokeWidth="0.6" opacity="0.5"/>
    <circle cx="24" cy="24" r="12" fill="none" stroke={color} strokeWidth="0.5" opacity="0.35"/>
    <path d="M24 38 C24 28,20 22,24 12 C28 22,24 28,24 38Z" fill="none" stroke={color} strokeWidth="0.8"/>
    <path d="M24 38 C21 30,14 26,10 18 C16 24,22 30,24 38Z" fill="none" stroke={color} strokeWidth="0.7" opacity="0.8"/>
    <path d="M24 38 C27 30,34 26,38 18 C32 24,26 30,24 38Z" fill="none" stroke={color} strokeWidth="0.7" opacity="0.8"/>
    <circle cx="24" cy="38" r="1.5" fill="none" stroke={color} strokeWidth="0.7"/>
  </svg>
));

const GoldLine=memo(({width='40px'})=>(
  <div style={{width,height:'1px',background:'linear-gradient(90deg,transparent,var(--gold),transparent)',margin:'0 auto'}}/>
));

/* ═══════════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════════ */

const NAV_ITEMS=['HOME','GALLERY','CHECK AVAILABILITY','PLAN YOUR CELEBRATIONS'];

const GOLD='var(--gold)';
const GOLD_BRIGHT='var(--gold-bright)';
const CREAM='var(--ivory)';
const CHARCOAL='var(--charcoal)';
const FOREST='var(--forest)';
const STONE='var(--stone)';
const CREAM_RGBA=(a)=>`rgba(247,243,237,${a})`;
const GOLD_RGBA=(a)=>`rgba(201,149,56,${a})`;

/* ═══════════════════════════════════════════════════════════
   MAIN COMPONENT
   ═══════════════════════════════════════════════════════════ */

function GalaRetreatPage(){
  const[menuOpen,setMenuOpen]=useState(false);
  const[scrollY,setScrollY]=useState(0);
  const[imgHover,setImgHover]=useState(false);
  const[introVisible,setIntroVisible]=useState(false);
  const introRef=useRef(null);

  /* ── Scroll tracking (passive, RAF-throttled) ────────── */
  useEffect(()=>{
    let ticking=false;
    const onScroll=()=>{
      if(!ticking){
        requestAnimationFrame(()=>{
          setScrollY(window.scrollY);
          ticking=false;
        });
        ticking=true;
      }
    };
    window.addEventListener('scroll',onScroll,{passive:true});
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);

  /* ── Intersection Observer for intro entrance ─────────── */
  useEffect(()=>{
    const el=introRef.current;
    if(!el)return;
    const obs=new IntersectionObserver(([entry])=>{
      if(entry.isIntersecting){setIntroVisible(true);obs.disconnect();}
    },{threshold:0.15});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);

  /* ── Lock body scroll when mobile menu open ───────────── */
  useEffect(()=>{
    if(menuOpen){document.body.style.overflow='hidden';}
    else{document.body.style.overflow='';}
    return()=>{document.body.style.overflow='';};
  },[menuOpen]);

  /* ── Keyboard: Escape closes mobile menu ──────────────── */
  useEffect(()=>{
    if(!menuOpen)return;
    const onKey=(e)=>{if(e.key==='Escape')setMenuOpen(false);};
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[menuOpen]);

  /* ── Memoized handlers ────────────────────────────────── */
  const openMenu=useCallback(()=>setMenuOpen(true),[]);
  const closeMenu=useCallback(()=>setMenuOpen(false),[]);
  const onImgEnter=useCallback(()=>setImgHover(true),[]);
  const onImgLeave=useCallback(()=>setImgHover(false),[]);

  /* ═════════════════════════════════════════════════════════
     STYLE OBJECTS
     ═════════════════════════════════════════════════════════ */

  /* ── Hero Background ──────────────────────────────────── */
  const heroBg={
    position:'absolute',inset:0,zIndex:1,
    backgroundImage:'url(assets/split-hero.png)',
    backgroundSize:'cover',backgroundPosition:'center center',
    animation:'kbz 18s ease-in-out infinite alternate',
    transformOrigin:'50% 50%',
    willChange:'transform',
  };

  /* ── Overlays ─────────────────────────────────────────── */
  const overlayGrad={
    position:'absolute',inset:0,zIndex:2,pointerEvents:'none',
    background:`linear-gradient(180deg,
      rgba(18,23,21,0.74) 0%,
      rgba(18,23,21,0.3) 26%,
      rgba(18,23,21,0.16) 48%,
      rgba(18,23,21,0.3) 72%,
      rgba(18,23,21,0.7) 100%
    )`,
  };
  const vignette={
    position:'absolute',inset:0,zIndex:2,pointerEvents:'none',
    background:'radial-gradient(ellipse 88% 72% at 50% 42%,transparent 36%,rgba(18,23,21,0.34) 70%,rgba(18,23,21,0.62) 100%)',
  };
  /* Soft dark pad behind the center logo + tagline for contrast */
  const centerBacking={
    position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',
    width:'min(600px,92vw)',aspectRatio:'1/1',zIndex:3,pointerEvents:'none',
    background:'radial-gradient(ellipse closest-side,rgba(12,16,14,0.5) 0%,rgba(12,16,14,0.28) 52%,transparent 78%)',
  };

  /* ── Navigation ───────────────────────────────────────── */
  const navWrap={
    position:'absolute',top:0,left:0,right:0,zIndex:50,
    display:'flex',alignItems:'center',justifyContent:'space-between',
    padding:'10px 44px',
    background:scrollY>60?'rgba(18,23,21,0.85)':'transparent',
    backdropFilter:scrollY>60?'blur(12px)':'none',
    WebkitBackdropFilter:scrollY>60?'blur(12px)':'none',
    transition:'background 0.4s ease,backdrop-filter 0.4s ease',
  };
  const logoWrap={display:'flex',alignItems:'center',gap:'10px',cursor:'pointer',textDecoration:'none'};
  const logoImgNav={height:'84px',width:'auto',filter:'drop-shadow(0 1px 6px rgba(0,0,0,0.25))',transition:'transform 0.3s ease'};
  const navLinks={display:'flex',alignItems:'center',gap:'32px'};
  const navLink={
    fontFamily:"'DM Sans',sans-serif",fontSize:'11px',fontWeight:500,
    letterSpacing:'1.8px',color:'#ffffff',textDecoration:'none',
    position:'relative',cursor:'pointer',transition:'color 0.3s ease',
    background:'none',border:'none',padding:'4px 0',
    textShadow:'0 1px 3px rgba(0,0,0,0.6)',
  };
  const navLinkLine={
    position:'absolute',bottom:'-2px',left:0,height:'1px',
    background:`linear-gradient(90deg,${GOLD},${GOLD_RGBA(0.3)})`,
    width:0,transition:'width 0.4s cubic-bezier(0.25,0.1,0.25,1)',
  };
  const ctaPill={
    fontFamily:"'DM Sans',sans-serif",fontSize:'10.5px',fontWeight:600,
    letterSpacing:'1.8px',color:CHARCOAL,background:CREAM,
    border:'none',borderRadius:'100px',padding:'11px 24px',
    cursor:'pointer',display:'flex',alignItems:'center',gap:'8px',
    transition:'all 0.35s cubic-bezier(0.25,0.1,0.25,1)',whiteSpace:'nowrap',
    boxShadow:'0 2px 12px rgba(0,0,0,0.15)',
  };

  /* ── Side Labels ──────────────────────────────────────── */
  const sideLabelBase={
    position:'absolute',top:'50%',transform:'translateY(-50%)',
    zIndex:30,pointerEvents:'none',
    animation:'fadeIn 1.2s ease 0.8s both',
  };
  const farmLabel={...sideLabelBase,left:'6%',textAlign:'left'};
  const convLabel={...sideLabelBase,right:'5%',textAlign:'right'};
  /* Frosted-glass backing + text shadows so labels pop off the photo */
  const glassBack={
    padding:'22px 26px',borderRadius:'16px',
    background:'rgba(12,16,14,0.46)',
    backdropFilter:'blur(30px) saturate(1.4)',
    WebkitBackdropFilter:'blur(30px) saturate(1.4)',
    border:'1px solid rgba(201,149,56,0.2)',
    boxShadow:'0 12px 36px rgba(0,0,0,0.35)',
  };
  const TEXT_CLEAR_SHADOW='0 1px 3px rgba(0,0,0,0.85),0 3px 14px rgba(0,0,0,0.65)';
  const TEXT_SOFT_SHADOW='0 1px 2px rgba(0,0,0,0.65),0 2px 10px rgba(0,0,0,0.5)';
  const labelEyebrow={
    fontFamily:"'DM Sans',sans-serif",fontSize:'11.5px',fontWeight:500,
    letterSpacing:'4.5px',color:GOLD_BRIGHT,marginBottom:'14px',
    textTransform:'uppercase',textShadow:TEXT_SOFT_SHADOW,
  };
  const labelTitle={
    fontFamily:"'Playfair Display',Georgia,serif",fontSize:'24px',fontWeight:500,
    letterSpacing:'3.5px',color:GOLD_BRIGHT,lineHeight:1.2,marginBottom:'8px',
    textShadow:TEXT_CLEAR_SHADOW,
  };
  const labelLine={
    width:'30px',height:'1px',marginBottom:'12px',
    background:`linear-gradient(90deg,${GOLD_RGBA(0.9)},transparent)`,
  };
  const labelTags={
    fontFamily:"'DM Sans',sans-serif",fontSize:'10px',fontWeight:400,
    letterSpacing:'2.5px',color:GOLD_RGBA(0.85),lineHeight:1.6,
    textShadow:TEXT_SOFT_SHADOW,
  };

  /* ── Center Branding ──────────────────────────────────── */
  const centerBrand={
    position:'absolute',top:'50%',left:'50%',
    transform:'translate(-50%,-50%)',zIndex:30,
    display:'flex',flexDirection:'column',alignItems:'center',
    textAlign:'center',pointerEvents:'none',width:'max-content',maxWidth:'80vw',
  };
  const logoImg={
    width:'clamp(200px,28vw,360px)',height:'auto',
    filter:'brightness(0.82) sepia(0.4) saturate(0.75) drop-shadow(0 10px 24px rgba(0,0,0,0.5)) drop-shadow(0 3px 8px rgba(0,0,0,0.4))',
  };
  const heroTagline={
    fontFamily:"'DM Sans',sans-serif",fontSize:'clamp(9px,1vw,12px)',
    fontWeight:600,letterSpacing:'clamp(4px,0.6vw,7px)',
    color:GOLD_BRIGHT,marginTop:'20px',lineHeight:1,
    textTransform:'uppercase',textShadow:TEXT_CLEAR_SHADOW,
  };

  /* ── Scroll Indicator ─────────────────────────────────── */
  const scrollInd={
    position:'absolute',bottom:'72px',left:'50%',transform:'translateX(-50%)',
    zIndex:30,display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',
    opacity:Math.max(0,1-scrollY/100),transition:'opacity 0.4s ease',
    animation:'scrollBounce 2s ease-in-out infinite',
    filter:'drop-shadow(0 2px 6px rgba(0,0,0,0.5))',
  };
  const scrollText={
    fontFamily:"'DM Sans',sans-serif",fontSize:'8px',fontWeight:500,
    letterSpacing:'3px',color:GOLD_RGBA(0.9),textTransform:'uppercase',
    textShadow:TEXT_SOFT_SHADOW,
  };

  /* ── Intro Section ────────────────────────────────────── */
  const introOuter={
    position:'relative',zIndex:10,marginTop:'-40px',
    paddingBottom:'80px',background:'transparent',
  };
  const introInner={
    maxWidth:'1200px',margin:'0 auto',padding:'0 44px',
    display:'flex',alignItems:'stretch',gap:'0',position:'relative',
    opacity:introVisible?1:0,
    transform:introVisible?'translateY(0)':'translateY(30px)',
    transition:'opacity 0.8s cubic-bezier(0.25,0.1,0.25,1),transform 0.8s cubic-bezier(0.25,0.1,0.25,1)',
  };

  /* ── Editorial Card ───────────────────────────────────── */
  const eCard={
    flex:'0 0 430px',background:CREAM,borderRadius:'20px',
    padding:'52px 48px',display:'flex',flexDirection:'column',
    justifyContent:'center',position:'relative',zIndex:12,
    boxShadow:'0 24px 64px rgba(0,0,0,0.1),0 2px 8px rgba(0,0,0,0.03)',
    border:'1px solid rgba(201,149,56,0.08)',
  };
  const eAccentLine={
    position:'absolute',top:'48px',left:'48px',right:'48px',
    height:'1px',background:`linear-gradient(90deg,${GOLD_RGBA(0.4)},${GOLD_RGBA(0.08)})`,
  };
  const eEyebrow={
    fontFamily:"'DM Sans',sans-serif",fontSize:'10px',fontWeight:600,
    letterSpacing:'4px',color:GOLD,marginBottom:'18px',
    textTransform:'uppercase',
  };
  const eHeading={
    fontFamily:"'Playfair Display',Georgia,serif",
    fontSize:'clamp(28px,3vw,40px)',fontWeight:600,
    color:CHARCOAL,lineHeight:1.15,marginBottom:'22px',
  };
  const ePara={
    fontFamily:"'DM Sans',sans-serif",fontSize:'14px',fontWeight:300,
    color:STONE,lineHeight:1.8,marginBottom:'32px',
  };
  const eBtn={
    fontFamily:"'DM Sans',sans-serif",fontSize:'10.5px',fontWeight:600,
    letterSpacing:'2.5px',color:'#ffffff',background:FOREST,
    border:'none',borderRadius:'100px',padding:'15px 30px',
    cursor:'pointer',display:'inline-flex',alignItems:'center',gap:'10px',
    transition:'all 0.35s cubic-bezier(0.25,0.1,0.25,1)',
    alignSelf:'flex-start',width:'fit-content',
    boxShadow:'0 4px 16px rgba(3,41,29,0.2)',
  };

  /* ── Property Image ───────────────────────────────────── */
  const propImgWrap={
    flex:'1',marginLeft:'-30px',borderRadius:'20px',overflow:'hidden',
    position:'relative',zIndex:11,
    boxShadow:'0 24px 64px rgba(0,0,0,0.12),0 4px 12px rgba(0,0,0,0.04)',
    minHeight:'360px',cursor:'pointer',
  };
  const propImg={
    width:'100%',height:'100%',objectFit:'cover',display:'block',
    transition:'transform 0.7s cubic-bezier(0.25,0.1,0.25,1)',
    transform:imgHover?'scale(1.04)':'scale(1)',
  };
  const propImgOverlay={
    position:'absolute',inset:0,pointerEvents:'none',
    background:'linear-gradient(180deg,transparent 40%,rgba(18,23,21,0.45) 100%)',
    transition:'opacity 0.5s ease',
    opacity:imgHover?0.8:0.6,
  };
  const propImgBrand={
    position:'absolute',bottom:'28px',left:'30px',zIndex:2,
    transition:'transform 0.5s cubic-bezier(0.25,0.1,0.25,1)',
    transform:imgHover?'translateY(-4px)':'translateY(0)',
  };
  const propImgBrandName={
    fontFamily:"'Playfair Display',Georgia,serif",
    fontSize:'15px',fontWeight:600,letterSpacing:'3.5px',color:CREAM,
    marginBottom:'5px',
  };
  const propImgBrandSub={
    fontFamily:"'DM Sans',sans-serif",fontSize:'8px',fontWeight:300,
    letterSpacing:'3px',color:CREAM_RGBA(0.55),
  };

  /* ── Mobile Menu ──────────────────────────────────────── */
  const mobOverlay={
    position:'fixed',inset:0,zIndex:1000,
    background:CREAM_RGBA(0.97),
    backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',
    display:'flex',flexDirection:'column',alignItems:'center',
    justifyContent:'center',gap:'28px',
    animation:'fadeIn 0.35s ease',
  };
  const mobLink={
    fontFamily:"'Playfair Display',Georgia,serif",
    fontSize:'20px',fontWeight:500,letterSpacing:'3.5px',
    color:CHARCOAL,textDecoration:'none',
    cursor:'pointer',background:'none',border:'none',padding:'10px 0',
    transition:'color 0.3s ease',
  };
  const mobClose={
    position:'absolute',top:'24px',right:'28px',
    background:'none',border:'none',cursor:'pointer',padding:'8px',
    transition:'transform 0.3s ease',
  };

  /* ── Mobile Hamburger ─────────────────────────────────── */
  const mobMenuBtn={
    display:'none',width:'44px',height:'44px',borderRadius:'50%',
    background:CREAM_RGBA(0.08),
    backdropFilter:'blur(8px)',WebkitBackdropFilter:'blur(8px)',
    border:`1px solid ${CREAM_RGBA(0.2)}`,
    alignItems:'center',justifyContent:'center',cursor:'pointer',
    transition:'background 0.3s ease',
  };

  /* ── Footer ───────────────────────────────────────────── */
  const footerWrap={
    background:CHARCOAL,padding:'64px 44px',
    display:'flex',alignItems:'center',justifyContent:'center',
    borderTop:`1px solid ${GOLD_RGBA(0.15)}`,
  };
  const footerText={
    fontFamily:"'DM Sans',sans-serif",fontSize:'10.5px',fontWeight:400,
    letterSpacing:'2.5px',color:CREAM_RGBA(0.35),textAlign:'center',lineHeight:2,
  };

  /* ═════════════════════════════════════════════════════════
     RENDER
     ═════════════════════════════════════════════════════════ */

  return(
    <div style={{minHeight:'100vh',background:'var(--ivory)'}}>

      {/* ── SKIP LINK (a11y) ─────────────────────────────── */}
      <a href="#intro" className="sr-only" style={{position:'absolute',top:0,left:0,zIndex:9999,padding:'12px 24px',background:FOREST,color:CREAM}}>Skip to content</a>

      {/* ════════════════════════════════════════════════════
          HERO SECTION
          ════════════════════════════════════════════════════ */}
      <section className="grain" style={{position:'relative',height:'75vh',minHeight:'580px',overflow:'hidden'}} aria-label="Gala Retreat Hero">

        {/* Background + Overlays */}
        <div style={heroBg}/>
        <div style={overlayGrad}/>
        <div style={vignette}/>
        <div style={centerBacking}/>

        {/* ── NAVIGATION ─────────────────────────────────── */}
        <nav style={navWrap} aria-label="Main navigation">
          <a href="#" style={logoWrap} aria-label="Gala Retreat home">
            <img src="assets/logo_bg.png" alt="" style={logoImgNav}/>
          </a>

          <div className="nav-links" style={navLinks} role="menubar">
            {NAV_ITEMS.map(item=>(
              <a key={item} href="#" style={navLink} role="menuitem"
                onMouseEnter={e=>{e.currentTarget.style.color=GOLD_BRIGHT;e.currentTarget.querySelector('.nav-line').style.width='100%'}}
                onMouseLeave={e=>{e.currentTarget.style.color='#ffffff';e.currentTarget.querySelector('.nav-line').style.width='0'}}
              >
                {item}
                <span className="nav-line" style={navLinkLine}/>
              </a>
            ))}
            <button style={ctaPill} role="menuitem"
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.2)'}}
              onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 2px 12px rgba(0,0,0,0.15)'}}
            >
              MAKE AN ENQUIRY <ArrowIcon size={12} color={CHARCOAL}/>
            </button>
          </div>

          <button className="mob-menu-btn" style={mobMenuBtn}
            onClick={openMenu} aria-label="Open navigation menu" aria-expanded={menuOpen}>
            <MenuIcon/>
          </button>
        </nav>

        {/* ── FARMHOUSE LABEL (left) ─────────────────────── */}
        <div className="farmhouse-label" style={farmLabel} aria-hidden="true">
          <div style={glassBack}>
            <div style={labelEyebrow}>A Serene</div>
            <div style={labelLine}/>
            <div style={{...labelTitle,color:'#ffffff'}}>FARMHOUSE</div>
            <div style={{...labelTags,color:'rgba(255,255,255,0.85)'}}>Relax · Reconnect · Rejuvenate</div>
          </div>
        </div>

        {/* ── CONVENTION HALL LABEL (right) ───────────────── */}
        <div className="conv-label" style={convLabel} aria-hidden="true">
          <div style={glassBack}>
            <div style={labelEyebrow}>A Grand</div>
            <div style={{...labelLine,margin:'0 0 10px auto',background:`linear-gradient(270deg,${GOLD_RGBA(0.7)},transparent)`}}/>
            <div style={{...labelTitle,color:'#ffffff'}}>CONVENTION HALL</div>
            <div style={{...labelTags,color:'rgba(255,255,255,0.85)'}}>Celebrate · Host · Create Memories</div>
          </div>
        </div>

        {/* ── CENTER BRANDING ─────────────────────────────── */}
        <div style={centerBrand}>
          <img src="assets/logo_bg.png" alt="Gala Retreat — A Luxurious Farm Stay" style={logoImg}/>
          <div style={heroTagline}>Farmhouse & Convention Centre</div>
        </div>

        {/* ── SCROLL INDICATOR ────────────────────────────── */}
        <div style={scrollInd} aria-hidden="true">
          <ScrollIcon size={16} color="#e0b45d"/>
          <span style={scrollText}>Scroll</span>
        </div>
      </section>

      {/* ════════════════════════════════════════════════════
          INTRO SECTION (overlapping editorial)
          ════════════════════════════════════════════════════ */}
      <div ref={introRef} id="intro" style={introOuter}>
        <div className="intro-inner" style={introInner}>

          {/* Editorial Text Card */}
          <div className="e-card" style={eCard}>
            <div style={eAccentLine}/>
            <div style={{...eEyebrow,marginTop:'8px'}}>The Retreat</div>
            <h2 style={eHeading}>
              Where Moments<br/>Find a Home
            </h2>
            <p style={ePara}>
              Gala Retreat is more than a destination — it's where nature, celebration
              and togetherness come alive. With a luxurious farmhouse and a grand convention
              hall, we craft the perfect setting for every occasion, intimate or grand.
            </p>
            <button style={eBtn}
              onMouseEnter={e=>{e.currentTarget.style.background='#061c16';e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(3,41,29,0.3)'}}
              onMouseLeave={e=>{e.currentTarget.style.background=FOREST;e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 16px rgba(3,41,29,0.2)'}}
            >
              DISCOVER OUR STORY <ArrowIcon size={12} color="#ffffff"/>
            </button>
          </div>

          {/* Property Image */}
          <div className="prop-img-wrap" style={propImgWrap}
            onMouseEnter={onImgEnter} onMouseLeave={onImgLeave}>
            <img src="assets/gallery-entrance.jpg"
              alt="Grand entrance driveway of Gala Retreat with palm trees and warm architectural lighting at dusk"
              style={propImg} loading="eager" fetchPriority="high"/>
            <div style={propImgOverlay}/>
            <div style={propImgBrand}>
              <BrandEmblem size={22} color={CREAM_RGBA(0.6)}/>
              <div style={{...propImgBrandName,marginTop:'8px'}}>GALA RETREAT</div>
              <div style={propImgBrandSub}>Nature · Celebrations · Togetherness</div>
            </div>
          </div>

        </div>
      </div>

      {/* ════════════════════════════════════════════════════
          FOOTER TEASER
          ════════════════════════════════════════════════════ */}
      <footer style={footerWrap}>
        <div style={{textAlign:'center'}}>
          <BrandEmblem size={30} color={GOLD_RGBA(0.35)}/>
          <div style={{marginTop:'16px'}}>
            <GoldLine width="48px"/>
          </div>
          <div style={{...footerText,marginTop:'16px'}}>
            GALA RETREAT · NATURE · CELEBRATIONS · TOGETHERNESS
          </div>
          <div style={{...footerText,marginTop:'20px',color:CREAM_RGBA(0.25)}}>
            © {new Date().getFullYear()} Gala Retreat. All rights reserved.
          </div>
        </div>
      </footer>

      {/* ════════════════════════════════════════════════════
          MOBILE MENU
          ════════════════════════════════════════════════════ */}
      {menuOpen&&(
        <div style={mobOverlay} role="dialog" aria-modal="true" aria-label="Navigation menu">
          <button style={mobClose} onClick={closeMenu} aria-label="Close navigation menu">
            <CloseIcon size={26}/>
          </button>
          <div style={{marginBottom:'8px'}}>
            <BrandEmblem size={28}/>
          </div>
          {NAV_ITEMS.map((item,i)=>(
            <a key={item} href="#" style={{...mobLink,animation:`fadeInUp 0.4s ease ${0.1+i*0.06}s both`}}
              onClick={closeMenu}>
              {item}
            </a>
          ))}
          <button style={{...eBtn,marginTop:'12px',animation:`fadeInUp 0.4s ease ${0.1+NAV_ITEMS.length*0.06}s both`}}
            onClick={closeMenu}>
            MAKE AN ENQUIRY <ArrowIcon size={12} color={CREAM}/>
          </button>
        </div>
      )}

      {/* ════════════════════════════════════════════════════
          RESPONSIVE STYLES
          ════════════════════════════════════════════════════ */}
      <style>{`
        @media(max-width:900px){
          .nav-links{display:none!important}
          .mob-menu-btn{display:flex!important}
          .farmhouse-label,.conv-label{display:none!important}
        }
        @media(min-width:901px){
          .mob-menu-btn{display:none!important}
        }
        @media(max-width:768px){
          .intro-inner{flex-direction:column!important;padding:0 20px!important}
          .e-card{flex:none!important;margin:0!important;padding:32px 28px!important}
          .prop-img-wrap{flex:none!important;margin-left:0!important;margin-top:-16px!important;min-height:280px!important;border-radius:0 0 20px 20px!important}
        }
        @media(max-width:480px){
          .e-card{padding:28px 22px!important}
        }
        @media(prefers-color-scheme:dark){
          :root{--ivory:#121715;--cream:#1a1f1c;--charcoal:#f7f3ed;--stone:#b0b0a8}
        }
      `}</style>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GalaRetreatPage/>);
</script>
</body>
</html>
